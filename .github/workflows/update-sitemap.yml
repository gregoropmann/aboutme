name: Update Sitemap
on:
  push:
    branches: [main]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update lastmod
        run: |
          DATE=$(git log -1 --format=%cs)
          sed -i "s|<lastmod>.*</lastmod>|<lastmod>$DATE</lastmod>|" sitemap.xml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update sitemap lastmod"